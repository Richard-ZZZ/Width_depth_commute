[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "width-depth-limits"
version = "0.1.0"
description = "Reproducibility code for width and depth limits in residual networks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.1,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
include = ["resnet_limits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
