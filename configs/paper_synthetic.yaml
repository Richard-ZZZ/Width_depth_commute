# A representative full-scale grid. Adjust device and batch sizes to your hardware.
experiment:
  name: paper_synthetic
  output_dir: results
  device: auto
  dtype: float32
  activations: [identity, tanh]
  widths: [128, 256, 512, 1024]
  depths: [8, 16, 32, 64]
  model_seeds: [0, 1, 2, 3, 4]
  steps: 10
  learning_rate: 0.1
data:
  dimension: 32
  train_size: 256
  test_size: 512
  seed: 0
